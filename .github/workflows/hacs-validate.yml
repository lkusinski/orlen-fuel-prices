name: Validate with HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: HACS validation
        # The public HACS action cannot read the files of a private repository
        # (raw file lookups are unauthenticated), so manifest/hacs.json checks
        # are expected to fail here. HACS itself still supports private repos
        # via a configured GitHub token. Keep this non-blocking.
        continue-on-error: true
        uses: "hacs/action@main"
        with:
          category: "integration"
